[project]
name = "boussole"
version = "0.1.0"
description = "Boussole : PMO piloté par agents, aligné sur le PMBOK 8"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "python-multipart>=0.0.33",
    "pypdf>=6.21.4",
    "fastembed>=0.9.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
    "fpdf2>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boussole"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C90", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # accents français dans les chaînes et commentaires

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "bench"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: nécessite une base PostgreSQL (BOUSSOLE_TEST_DATABASE_URL)"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["boussole"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
