# nginx de l'hôte devant Boussole (ADR 0009), testé avec nginx 1.24 (version du VPS).
# Sur le VPS, remplace le contenu de /etc/nginx/sites-available/boussole.optigenius.pro
# (même nom de fichier, un seul fichier pour ce server_name). Certificats : certbot.
#
# Points de sécurité (audit du 1er novembre 2026) :
# - X-Remote-User est TOUJOURS réécrit avec le compte authentifié ici : la valeur envoyée
#   par le client est écrasée. Boussole en tire l'identité et le rôle.
# - X-Forwarded-Host est vidé : Boussole ne s'y fie pas (origine dans BOUSSOLE_ALLOWED_ORIGINS).
# - Les POST (appels payants, décisions) sont limités par compte et par adresse.

# Limite des POST : clé vide pour GET/HEAD (non limités)
map $request_method $boussole_post_key {
    POST    "$remote_user:$binary_remote_addr";
    default "";
}
limit_req_zone $boussole_post_key zone=boussole_post:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name boussole.optigenius.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (VPS) : http2 se déclare sur listen (la directive « http2 on » date de 1.25)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boussole.optigenius.pro;

    # Certificats et réglages TLS gérés par certbot (protocoles, chiffrements, sessions)
    ssl_certificate     /etc/letsencrypt/live/boussole.optigenius.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boussole.optigenius.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Scripts et styles servis par Boussole seulement (aucun CDN); « unsafe-inline » couvre
    # le script de la page Paramètres et les attributs style des gabarits.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Un compte par personne (htpasswd -B), jamais un mot de passe partagé :
    # le compte devient le signataire des décisions.
    auth_basic "Boussole";
    auth_basic_user_file /etc/nginx/boussole.htpasswd;

    location / {
        limit_req zone=boussole_post burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # La sonde de santé reste interne au conteneur
    location = /health {
        return 404;
    }
}
