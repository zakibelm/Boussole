# PostgreSQL 16 + pgvector pour le développement local (ADR 0001).
# Authentification « trust » : aucun secret à créer, conteneur joignable
# seulement depuis 127.0.0.1 et sans donnée réelle. Jamais hors du poste local.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: boussole
      POSTGRES_DB: boussole
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - boussole-db:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boussole"]
      interval: 2s
      retries: 15

volumes:
  boussole-db:
