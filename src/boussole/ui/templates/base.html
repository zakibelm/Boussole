<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Boussole{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5f6b7d; --line: #dfe3ea;
      --accent: #1f5fbf; --accent-soft: #e8f0fc; --ok: #1a7f4b; --err: #b42318; --warn-soft: #fff6e5;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --panel: #1a1f27; --text: #e6e9ef; --muted: #9aa5b5; --line: #2c3340;
        --accent: #6ea2ff; --accent-soft: #1e2a40; --ok: #4cc38a; --err: #ff7b72; --warn-soft: #2e2716;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 24px;
             display: flex; align-items: center; gap: 12px; }
    header .logo { font-weight: 700; font-size: 18px; }
    header nav { margin-left: auto; color: var(--muted); font-size: 14px; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
         margin: 24px 0 8px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 20px; margin-bottom: 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input.model-search { display: block; width: 100%; margin-bottom: 4px; }
    input[type=text], input[type=password], input[type=search], input[list], textarea, select {
      font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; padding: 7px 10px; }
    textarea { width: 100%; min-height: 140px; resize: vertical; font-family: ui-monospace, Consolas, monospace;
               font-size: 13px; }
    button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
             border-radius: 6px; padding: 7px 12px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.link { border: none; background: none; color: var(--accent); padding: 4px 6px; }
    button.danger { color: var(--err); }
    .muted { color: var(--muted); font-size: 13px; }
    .notice { color: var(--ok); } .error { color: var(--err); }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; }
    tr.child td:first-child { padding-left: 28px; }
    tr.child td:first-child::before { content: "↳ "; color: var(--muted); }
    td.model input { width: 100%; min-width: 220px; }
    .status { font-size: 12px; min-width: 90px; display: inline-block; }
    .skill-panel td { background: var(--accent-soft); padding: 16px; }
    .proposal { background: var(--warn-soft); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 12px; }
    .history li { margin-bottom: 4px; }
    .meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; max-width: 320px; }
    .meter span { display: block; height: 100%; background: var(--accent); }
    pre.rules { white-space: pre-wrap; background: var(--bg); padding: 12px; border-radius: 6px;
                font-size: 13px; margin: 0; }
    .table-wrap { overflow-x: auto; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); }
    .badge-automation { background: var(--accent-soft); }
    .badge-assistance { background: var(--warn-soft); }
    .badge-augmentation { background: var(--bg); font-weight: 600; }
    header nav a { color: var(--accent); margin-right: 14px; text-decoration: none; }
    a { color: var(--accent); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .tile { border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 13px; color: var(--muted); }
    .tile .big { display: block; font-size: 22px; font-weight: 700; color: var(--text); }
    .tile.alert .big { color: var(--err); }
    .answer-text { white-space: pre-wrap; background: var(--bg); border-radius: 6px; padding: 12px; font-size: 14px; }
    .answer-md { background: var(--bg); border-radius: 6px; padding: 4px 14px; font-size: 14px; }
    .answer-md h4 { margin: 12px 0 6px; font-size: 15px; }
    .answer-md table { font-size: 13px; margin: 6px 0; }
    .answer { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
    ol.sources { font-size: 13px; margin-top: 0; }
    ol.sources li.cited { font-weight: 600; }
    .htmx-indicator { display: none; } .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
    label select { margin-left: 6px; }
  </style>
</head>
<body>
  <header><span class="logo">🧭 Boussole</span><nav><a href="/projects">Projets</a><a href="/settings">Paramètres</a>Opérateur : {{ operator }}</nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
